    <script>
      // Gracefully ignore harmless WebSocket or Vite HMR disconnect logs in AI Studio preview iframe
      window.addEventListener('error', function (e) {
        if (e.message && (e.message.includes('WebSocket') || e.message.includes('[vite]'))) {
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('unhandledrejection', function (e) {
        if (e.reason && String(e.reason).includes('WebSocket')) {
          e.preventDefault();
        }
      });
    </script>
