<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A4A32"/>
      <stop offset="100%" stop-color="#2D2D1E"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="100%" stop-color="#C5A059"/>
    </linearGradient>
    <linearGradient id="parcelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#82B37A" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3D5A40" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Subtle Cadastral Grid lines -->
  <path d="M 64 128 h 384 M 64 256 h 384 M 64 384 h 384" stroke="#7A7A56" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.4"/>
  <path d="M 128 64 v 384 M 256 64 v 384 M 384 64 v 384" stroke="#7A7A56" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.4"/>
  
  <!-- Outer Gold Border -->
  <rect x="28" y="28" width="456" height="456" rx="90" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.8"/>

  <!-- Stylized Land Parcel Polygon (Aks Shajra) -->
  <polygon points="140,160 360,130 400,320 280,410 130,340" fill="url(#parcelGrad)" stroke="#FAF8F5" stroke-width="8" stroke-linejoin="round"/>

  <!-- Sub-plot Boundary Division -->
  <line x1="260" y1="144" x2="280" y2="410" stroke="#F3E5AB" stroke-width="4" stroke-dasharray="8,6"/>
  <line x1="140" y1="160" x2="280" y2="280" stroke="#F3E5AB" stroke-width="3" stroke-dasharray="6,4"/>

  <!-- Munara / Benchmark Corner Boundary Stones -->
  <circle cx="140" cy="160" r="14" fill="#C5A059" stroke="#FFF" stroke-width="3"/>
  <circle cx="360" cy="130" r="14" fill="#C5A059" stroke="#FFF" stroke-width="3"/>
  <circle cx="400" cy="320" r="14" fill="#C5A059" stroke="#FFF" stroke-width="3"/>
  <circle cx="280" cy="410" r="14" fill="#C5A059" stroke="#FFF" stroke-width="3"/>
  <circle cx="130" cy="340" r="14" fill="#C5A059" stroke="#FFF" stroke-width="3"/>

  <!-- Centroid Khasra Emblem / Emblem Badge -->
  <circle cx="256" cy="245" r="42" fill="#FAF8F5" stroke="#4A4A32" stroke-width="4"/>
  <text x="256" y="252" font-family="'Outfit', sans-serif" font-size="20" font-weight="900" fill="#2D2D1E" text-anchor="middle" dominant-baseline="middle">DILRMP</text>
  <text x="256" y="272" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" fill="#78350F" text-anchor="middle">भू-नक्शा</text>
</svg>
